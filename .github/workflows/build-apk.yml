name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7-stable
          use-dotnet: false
          include-templates: true

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Godot for Android
        run: |
          mkdir -p ~/.config/godot build
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug" -noprompt
          cat > ~/.config/godot/editor_settings-4.xml <<EOF
          <?xml version="1.0" encoding="UTF-8" ?>
          <resource>
            <string name="export/android/android_sdk_path">$ANDROID_HOME</string>
            <string name="export/android/debug_keystore">$GITHUB_WORKSPACE/debug.keystore</string>
            <string name="export/android/debug_keystore_user">androiddebugkey</string>
            <string name="export/android/debug_keystore_pass">android</string>
          </resource>
          EOF

      - name: Export debug APK
        run: godot --headless --export-debug "Android" "build/space-shooters-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: space-shooters-debug-apk
          path: build/*.apk
