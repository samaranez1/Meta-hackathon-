plugins {
    id("com.android.library")
}

android {
    namespace = "org.godotengine.plugin.google.admob"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk = rootProject.ext.minSdkVersion
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Godot engine classes are provided at runtime by the Android export;
    // they are compile-only here. See android-plugins/README.md.
    compileOnly(rootProject.ext.godotLib)
    implementation("com.google.android.gms:play-services-ads:${rootProject.ext.gmaAdsVersion}")
}
